<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASSHASH // Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #0f1318;
    --border: #1e2730;
    --accent: #00ff9d;
    --accent2: #00c9ff;
    --danger: #ff4757;
    --text: #c8d6e5;
    --muted: #4a5568;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,157,0.015) 2px, rgba(0,255,157,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,201,255,0.01) 40px, rgba(0,201,255,0.01) 41px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .logo {
    font-family: var(--mono);
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: 0.15em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,255,157,0.5);
  }

  .logo span { color: var(--accent2); }

  .tagline {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-top: 0.4rem;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px 4px 0 0;
  }

  .card-label {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* Password Output */
  .pw-display {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
  }

  #password-output {
    font-family: var(--mono);
    font-size: clamp(0.9rem, 3vw, 1.1rem);
    color: var(--accent);
    flex: 1;
    word-break: break-all;
    letter-spacing: 0.05em;
    min-height: 1.5em;
  }

  .pw-strength {
    display: flex;
    gap: 3px;
    margin-bottom: 1rem;
  }

  .bar {
    height: 4px;
    flex: 1;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.3s;
  }

  .bar.weak { background: var(--danger); }
  .bar.fair { background: #ffa502; }
  .bar.good { background: #eccc68; }
  .bar.strong { background: var(--accent); }

  /* Options */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    color: var(--muted);
    transition: all 0.2s;
    user-select: none;
  }

  .toggle.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,255,157,0.05);
  }

  .toggle input { display: none; }

  .toggle .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid currentColor;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle.active .dot { background: var(--accent); }

  /* Length Slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
  }

  .slider-label {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(0,255,157,0.6);
    cursor: pointer;
  }

  #len-display {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--accent);
    min-width: 2.5ch;
    text-align: right;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.75rem;
  }

  .btn {
    flex: 1;
    padding: 0.7rem 1rem;
    border: none;
    border-radius: 3px;
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }

  .btn-primary:hover {
    box-shadow: 0 0 20px rgba(0,255,157,0.4);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--accent2);
  }

  .btn-secondary:hover {
    background: rgba(0,201,255,0.08);
    box-shadow: 0 0 15px rgba(0,201,255,0.2);
  }

  .btn:active { transform: scale(0.97); }

  /* Hash Section */
  .hash-algo-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .algo-btn {
    padding: 0.35rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .algo-btn.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(0,201,255,0.08);
  }

  .hash-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.75rem 1rem;
  }

  .hash-item {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }

  .hash-item:last-child { border-bottom: none; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hash-algo-name {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent2);
    letter-spacing: 0.1em;
  }

  .hash-value {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text);
    word-break: break-all;
    opacity: 0.8;
  }

  .copy-hash {
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 0.2rem 0.4rem;
    border: 1px solid var(--muted);
    border-radius: 2px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .copy-hash:hover { border-color: var(--accent); color: var(--accent); }
  .copy-hash.copied { border-color: var(--accent); color: var(--accent); }

  /* Custom Input */
  .custom-input-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
    align-items: center;
  }

  .custom-input-row input[type=text] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.55rem 0.8rem;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .custom-input-row input[type=text]:focus { border-color: var(--accent2); }
  .custom-input-row input[type=text]::placeholder { color: var(--muted); }

  .notice {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }

  .notice span { color: var(--danger); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    padding: 0.5rem 1.2rem;
    border-radius: 3px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">PASS<span>//</span>HASH</div>
    <div class="tagline">Secure Password Generator &amp; Hash Tool</div>
  </header>

  <!-- GENERATOR CARD -->
  <div class="card">
    <div class="card-label">// Generate Password</div>

    <div class="pw-display">
      <span id="password-output">— click generate —</span>
    </div>

    <div class="pw-strength" id="strength-bars">
      <div class="bar" id="b1"></div>
      <div class="bar" id="b2"></div>
      <div class="bar" id="b3"></div>
      <div class="bar" id="b4"></div>
    </div>

    <div class="slider-row">
      <span class="slider-label">Length</span>
      <input type="range" id="length-slider" min="8" max="64" value="20">
      <span id="len-display">20</span>
    </div>

    <div class="options-grid">
      <label class="toggle active" id="toggle-upper">
        <input type="checkbox" id="opt-upper" checked>
        <span class="dot"></span> Uppercase
      </label>
      <label class="toggle active" id="toggle-lower">
        <input type="checkbox" id="opt-lower" checked>
        <span class="dot"></span> Lowercase
      </label>
      <label class="toggle active" id="toggle-numbers">
        <input type="checkbox" id="opt-numbers" checked>
        <span class="dot"></span> Numbers
      </label>
      <label class="toggle active" id="toggle-symbols">
        <input type="checkbox" id="opt-symbols" checked>
        <span class="dot"></span> Symbols
      </label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="generatePassword()">Generate</button>
      <button class="btn btn-secondary" onclick="copyPassword()">Copy</button>
    </div>
  </div>

  <!-- HASH CARD -->
  <div class="card">
    <div class="card-label">// Hash Output</div>

    <div class="custom-input-row">
      <input type="text" id="custom-text" placeholder="Or type / paste text to hash…">
      <button class="btn btn-secondary" style="flex:none;padding:0.55rem 1rem" onclick="hashCustom()">Hash</button>
    </div>

    <div class="hash-algo-row">
      <button class="algo-btn active" data-algo="SHA-1">SHA-1</button>
      <button class="algo-btn active" data-algo="SHA-256">SHA-256</button>
      <button class="algo-btn active" data-algo="SHA-384">SHA-384</button>
      <button class="algo-btn active" data-algo="SHA-512">SHA-512</button>
    </div>

    <div class="hash-display" id="hash-display">
      <div class="hash-value" style="color:var(--muted);font-size:0.75rem">Generate a password or enter text to see hashes.</div>
    </div>

    <div class="notice"><span>⚠</span> SHA-1 is cryptographically broken. Use SHA-256+ for security purposes.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // --- State ---
  let currentPassword = '';
  let activeAlgos = new Set(['SHA-1','SHA-256','SHA-384','SHA-512']);

  // --- Slider ---
  const slider = document.getElementById('length-slider');
  const lenDisplay = document.getElementById('len-display');
  slider.addEventListener('input', () => { lenDisplay.textContent = slider.value; });

  // --- Toggle checkboxes ---
  document.querySelectorAll('.toggle').forEach(label => {
    label.addEventListener('click', () => {
      const cb = label.querySelector('input[type=checkbox]');
      // Prevent unchecking if it's the only active one
      const activeCount = document.querySelectorAll('.toggle.active').length;
      if (label.classList.contains('active') && activeCount === 1) {
        showToast('At least one charset required');
        return;
      }
      label.classList.toggle('active');
      cb.checked = label.classList.contains('active');
    });
  });

  // --- Algo toggle ---
  document.querySelectorAll('.algo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const algo = btn.dataset.algo;
      if (activeAlgos.has(algo) && activeAlgos.size === 1) {
        showToast('At least one algorithm required');
        return;
      }
      if (activeAlgos.has(algo)) {
        activeAlgos.delete(algo);
        btn.classList.remove('active');
      } else {
        activeAlgos.add(algo);
        btn.classList.add('active');
      }
      if (currentPassword) renderHashes(currentPassword);
    });
  });

  // --- Password generation ---
  function generatePassword() {
    const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const nums   = '0123456789';
    const syms   = '!@#$%^&*()-_=+[]{}|;:,.<>?';

    let charset = '';
    let required = [];

    if (document.getElementById('opt-upper').checked)   { charset += upper; required.push(upper); }
    if (document.getElementById('opt-lower').checked)   { charset += lower; required.push(lower); }
    if (document.getElementById('opt-numbers').checked) { charset += nums;  required.push(nums); }
    if (document.getElementById('opt-symbols').checked) { charset += syms;  required.push(syms); }

    const len = parseInt(slider.value);
    const arr = new Uint32Array(len + required.length);
    crypto.getRandomValues(arr);

    let pw = required.map((set, i) => set[arr[len + i] % set.length]);
    for (let i = pw.length; i < len; i++) pw.push(charset[arr[i] % charset.length]);

    // Fisher-Yates shuffle
    for (let i = pw.length - 1; i > 0; i--) {
      const j = arr[i] % (i + 1);
      [pw[i], pw[j]] = [pw[j], pw[i]];
    }

    currentPassword = pw.join('');
    document.getElementById('password-output').textContent = currentPassword;
    updateStrength(currentPassword);
    renderHashes(currentPassword);
  }

  function updateStrength(pw) {
    let score = 0;
    if (pw.length >= 12) score++;
    if (pw.length >= 20) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    if (pw.length >= 32) score++;

    const level = score <= 1 ? 1 : score <= 3 ? 2 : score <= 4 ? 3 : 4;
    const classes = ['','weak','fair','good','strong'];
    for (let i = 1; i <= 4; i++) {
      const bar = document.getElementById(`b${i}`);
      bar.className = 'bar ' + (i <= level ? classes[level] : '');
    }
  }

  // --- Hashing ---
  async function digest(algo, text) {
    const encoded = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest(algo, encoded);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function renderHashes(text) {
    const container = document.getElementById('hash-display');
    container.innerHTML = '';

    const algos = ['SHA-1','SHA-256','SHA-384','SHA-512'].filter(a => activeAlgos.has(a));

    for (const algo of algos) {
      const hash = await digest(algo, text);
      const item = document.createElement('div');
      item.className = 'hash-item';
      item.innerHTML = `
        <span class="hash-algo-name">${algo}</span>
        <span class="hash-value">${hash}</span>
        <button class="copy-hash" onclick="copyHash(this, '${hash}')">COPY</button>
      `;
      container.appendChild(item);
    }
  }

  function hashCustom() {
    const val = document.getElementById('custom-text').value.trim();
    if (!val) { showToast('Enter text to hash'); return; }
    currentPassword = val;
    document.getElementById('password-output').textContent = val;
    updateStrength(val);
    renderHashes(val);
  }

  // --- Copy helpers ---
  function copyPassword() {
    if (!currentPassword) { showToast('Nothing to copy'); return; }
    navigator.clipboard.writeText(currentPassword).then(() => showToast('Password copied!'));
  }

  function copyHash(btn, hash) {
    navigator.clipboard.writeText(hash).then(() => {
      btn.textContent = 'COPIED';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1500);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // --- Init ---
  generatePassword();
</script>
</body>
</html>
